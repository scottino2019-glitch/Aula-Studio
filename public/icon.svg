<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect x="32" y="32" width="448" height="448" rx="48" fill="#ffffff" stroke="#e1f5fe" stroke-width="8"/>
  <rect x="32" y="32" width="448" height="448" rx="48" fill="#f4f4f9"/>
  <!-- Notebook Page -->
  <rect x="70" y="60" width="372" height="392" rx="24" fill="#ffffff" filter="drop-shadow(4px 4px 10px rgba(0,0,0,0.1))"/>
  <!-- Spiral holes -->
  <circle cx="105" cy="100" r="10" fill="#999999"/>
  <circle cx="105" cy="160" r="10" fill="#999999"/>
  <circle cx="105" cy="220" r="10" fill="#999999"/>
  <circle cx="105" cy="280" r="10" fill="#999999"/>
  <circle cx="105" cy="340" r="10" fill="#999999"/>
  <circle cx="105" cy="400" r="10" fill="#999999"/>
  <!-- Sticky note yellow -->
  <rect x="150" y="110" width="240" height="150" rx="20" fill="#fff9c4" transform="rotate(2 270 185)"/>
  <text x="270" y="180" font-family="'Indie Flower', cursive, sans-serif" font-size="36" font-weight="bold" fill="#333333" text-anchor="middle">App Studio 📝</text>
  <!-- Accent Pink Box -->
  <rect x="150" y="280" width="240" height="130" rx="20" fill="#ffdae9" transform="rotate(-2 270 345)"/>
  <text x="270" y="350" font-family="'Indie Flower', cursive, sans-serif" font-size="30" fill="#4a4a4a" text-anchor="middle">Study Home 🧡</text>
</svg>
