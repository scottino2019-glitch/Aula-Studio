      border-bottom: 1px solid currentColor;
      opacity: 0.8;

      text-align: justify;
      line-height: 1.8;
      margin-bottom: 1.25rem;
      text-indent: 1.5rem;
    }
    
    .chapter-content p:first-of-type {
      text-indent: 0;
    }
    
    .chapter-content p:first-of-type::first-letter {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 3.5rem;
      float: left;
      line-height: 1;
      padding-right: 0.5rem;
      margin-top: 0.1rem;
    }
    
    .chapter-content ul, .chapter-content ol {
      margin: 1.5rem 0;
      padding-left: 2rem;
    }
    
    .chapter-content li {
      margin-bottom: 0.5rem;
      line-height: 1.7;
    }
    
    .chapter-content table {
      width: 100%;
      margin: 2rem 0;
      border-collapse: collapse;
    }
    
    .chapter-content th, .chapter-content td {
      padding: 0.75rem 1rem;
      text-align: left;
      border: 1px solid currentColor;
      opacity: 0.9;
    }
    
    .chapter-content th {
      font-weight: 600;
    }
    
    .chapter-content blockquote {
      margin: 2rem 0;
      padding: 1.5rem 2rem;
      font-style: italic;
      border-left: 3px solid currentColor;
      opacity: 0.9;
    }
    
    .sidebar-item {
      transition: all 0.2s ease;
    }
    
    .sidebar-item:hover {
      padding-left: 1rem;
    }
    
    .page-transition {
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .ornament::before {
      content: "❧";
      display: block;
      text-align: center;
      font-size: 1.5rem;
      margin: 2rem 0;
      opacity: 0.4;
    }
    
    ::-webkit-scrollbar {
      width: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {

<p>La struttura è pensata per essere chiara e leggibile, con un'estetica classica che richiama i libri tradizionali ma con tutte le funzionalità moderne di un documento digitale.</p>
<blockquote>"Un libro ben organizzato è come una casa ben costruita: ogni stanza ha il suo scopo e ogni corridoio porta dove deve portare."</blockquote>
<p>Nelle prossime pagine troverai esempi di tutti gli elementi che puoi utilizzare: liste, tabelle, citazioni e molto altro.</p>`,
      ch1_sec1_content: `<p>Il testo è l'elemento fondamentale di ogni libro. In questo template, i paragrafi sono formattati con giustificazione completa e un'interlinea generosa per facilitare la lettura. Il primo paragrafo di ogni sezione presenta una lettera capitale decorativa.</p>
<p>Puoi scrivere paragrafi di qualsiasi lunghezza. Il sistema si adatterà automaticamente alla larghezza disponibile, mantenendo sempre una leggibilità ottimale.</p>
<p>È importante strutturare il testo in modo logico, dividendo i concetti in paragrafi distinti e utilizzando le sezioni per raggruppare argomenti correlati.</p>`,
      ch1_sec2_content: `<p>Le liste sono utili per organizzare informazioni in modo chiaro e scannerizzabile. Ecco un esempio di lista non ordinata:</p>
<ul>
  <li>Primo elemento della lista con una descrizione dettagliata</li>
  <li>Secondo elemento che spiega un altro concetto</li>
  <li>Terzo elemento per completare l'elenco</li>
  <li>Quarto elemento bonus</li>
</ul>
<p>E qui invece una lista numerata per procedure o sequenze:</p>
<ol>
  <li>Prima fase del processo</li>
  <li>Seconda fase con le istruzioni</li>
  <li>Terza fase per completare</li>
  <li>Verifica finale dei risultati</li>
</ol>`,
      ch2_sec1_content: `<p>Le tabelle sono essenziali quando devi presentare dati strutturati o confrontare informazioni. Ecco un esempio di tabella ben formattata:</p>
<table>
  <thead>
    <tr>
      <th>Elemento</th>
      <th>Descrizione</th>
      <th>Utilizzo</th>
    </tr>
  </thead>

    <tr>

      <td>Blocco di testo continuo</td>

    </tr>

      <td>Elenco di elementi</td>

    </tr>
    <tr>
      <td>Tabella</td>
      <td>Dati strutturati</td>

    </tr>
    <tr>
      <td>Citazione</td>
      <td>Testo in evidenza</td>
      <td>Quote e riferimenti</td>
    </tr>
  </tbody>
</table>
<p>Le tabelle si adattano alla larghezza disponibile e mantengono una formattazione consistente con il resto del documento.</p>`,
      ch3_sec1_content: `<p>Le citazioni permettono di evidenziare passaggi importanti o di riportare le parole di altri autori. Sono particolarmente utili per:</p>
<ul>
  <li>Enfatizzare concetti chiave</li>
  <li>Riportare fonti autorevoli</li>
  <li>Creare pause riflessive nel testo</li>
</ul>
<blockquote>"La semplicità è la sofisticazione suprema. Un design pulito comunica più di mille decorazioni."<br><br>����� Leonardo da Vinci</blockquote>
<p>Le citazioni creano un ritmo nel testo, permettendo al lettore di soffermarsi sui concetti più importanti prima di procedere con la lettura.</p>`,
      ch3_sec2_content: `<p>Oltre alle citazioni, puoi utilizzare diversi elementi per arricchire il contenuto del tuo libro:</p>
<ul>
  <li><strong>Testo in grassetto</strong> per enfatizzare parole chiave</li>
  <li><em>Testo in corsivo</em> per termini tecnici o stranieri</li>
  <li>Combinazioni per <strong><em>massima enfasi</em></strong></li>
</ul>
<p>Ricorda che l'uso moderato di questi elementi è più efficace di un uso eccessivo. Come in cucina, la giusta dose di spezie esalta il piatto senza sovrastarlo.</p>`,
      ch4_sec1_content: `<p>In questo libro abbiamo esplorato tutti gli elementi principali che puoi utilizzare per creare documentazione professionale e leggibile. Ricapitoliamo i punti chiave:</p>
<ol>
  <li>I <strong>paragrafi</strong> sono la base del contenuto testuale</li>
  <li>Le <strong>liste</strong> organizzano informazioni in modo chiaro</li>
  <li>Le <strong>tabelle</strong> presentano dati strutturati</li>
  <li>Le <strong>citazioni</strong> evidenziano passaggi importanti</li>
  <li>La <strong>navigazione</strong> permette di muoversi facilmente</li>
</ol>
<blockquote>"Ogni grande viaggio inizia con un singolo passo. Questo libro è il tuo primo passo verso una documentazione migliore."</blockquote>`,

  <li>Usa le sezioni per dividere argomenti complessi</li>
  <li>Alterna testo, liste e tabelle per varietà</li>
  <li>Inserisci citazioni per creare pause riflessive</li>
  <li>Rivedi e rifinisci il contenuto più volte</li>
</ul>
<p>Buona scrittura!</p>
<div class="ornament"></div>
<p class="text-center italic opacity-70">Fine del libro</p>`

        sidebar.classList.remove('translate-x-0');
        overlay.classList.add('hidden');
      }
    }

    // Applica configurazione
    function applyConfig() {
      document.getElementById('book-title').textContent = config.book_title;
      document.getElementById('author-name').textContent = config.author_name;
      document.getElementById('toc-title').textContent = config.toc_title;
      
      document.body.style.backgroundColor = config.background_color;
      document.getElementById('sidebar').style.backgroundColor = config.sidebar_color;
      document.getElementById('content').style.color = config.text_color;
      document.getElementById('book-title').style.color = config.accent_color;
      
      document.querySelectorAll('#prev-btn, #next-btn, #menu-toggle').forEach(btn => {
        btn.style.backgroundColor = config.button_color;
      });
    }

    // Inizializza
    loadFromLocalStorage();
    document.getElementById('total-chapters').textContent = `${bookContent.length} capitoli`;
    renderChapter();
    applyConfig();
  </script>
