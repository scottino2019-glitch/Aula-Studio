<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lingua Cinese - Biblioteca</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #e74c3c;
            padding: 20px;
            text-align: center;
            color: white;
        }
        h1 { margin: 0 0 10px 0; }
        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }
        .pdf-viewer {
            margin-bottom: 40px;
            background: white;
            padding: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            min-height: 200px;
        }
        canvas {
            width: 100%;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            display: block;
        }
        /* Bottoni di selezione PDF */
        .pdf-buttons {
            text-align: center;
            margin-bottom: 20px;
        }
        .pdf-buttons button {
            padding: 10px 18px;
            margin: 5px;
            background-color: #e74c3c;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .pdf-buttons button:hover {
            background-color: #c0392b;
        }
        .home-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 15px;
            color: white;
            font-weight: 600;
            background: linear-gradient(to right, #ef4444, #b91c1c);
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            text-decoration: none;
        }
        .home-btn:hover {
            background: linear-gradient(to right, #dc2626, #991b1b);
        }
    </style>
</head>
<body>
    <header>
        <h1>📖 Biblioteca</h1>
        
        <button class="home-btn" onclick="window.history.length > 1 ? window.history.back() : window.close()">
            <span style="margin-right: 6px;">
                <svg style="width:20px; height:20px; vertical-align:middle;" fill="none" stroke="#FFFFFF" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
            </span>home
        </button>
    </header>

    <div class="container">
        <div class="pdf-buttons">
            <button onclick="loadPDF('chinese-per-i-bambini.pdf')">📄 Chinese per Elementari</button>
            <button onclick="loadPDF('Atena_Grammatica.pdf')">📄 Grammatica Coreana</button>
        </div>
        <div id="pdf-viewer" class="pdf-viewer"></div>
    </div>

    <!-- Libreria PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
    <script>
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js';

        function loadPDF(url) {
            const viewer = document.getElementById('pdf-viewer');
            viewer.innerHTML = '<p style="text-align:center; padding: 20px; color: #666;">Caricamento documento PDF in corso...</p>';
            
            pdfjsLib.getDocument(url).promise.then(function(pdf) {
                viewer.innerHTML = '';
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    pdf.getPage(pageNum).then(function(page) {
                        const scale = 1.3;
                        const viewport = page.getViewport({ scale });
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        viewer.appendChild(canvas);
                        const renderContext = {
                            canvasContext: context,
                            viewport: viewport
                        };
                        page.render(renderContext);
                    });
                }
            }).catch(function(err) {
                console.warn('First attempt failed for:', url, err);
                // Fallback attempt for file path variations
                let fallbackUrl = url;
                if (url.startsWith('pdf/')) {
                    fallbackUrl = url.replace('pdf/', '');
                } else if (url === 'pdf/chinese.pdf' || url === 'chinese.pdf') {
                    fallbackUrl = 'chinese-per-i-bambini.pdf';
                }

                if (fallbackUrl !== url) {
                    loadPDF(fallbackUrl);
                } else {
                    viewer.innerHTML = '<p style="text-align:center; color:red; padding: 20px;">Impossibile caricare il PDF (' + url + ').</p>';
                }
            });
        }

        // Carica il primo PDF di default
        loadPDF('chinese-per-i-bambini.pdf');
    </script>
</body>
</html>
