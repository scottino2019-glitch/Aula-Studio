<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esercizi e Quiz Cinese</title>
  <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Indie Flower', cursive, sans-serif;
      background: #f4f4f9;
      color: #333;
      padding: 30px;
      margin: 0;
      display: flex;
      justify-content: center;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      border: 2px solid #ffdae9;
    }
    h1 { color: #d81b60; margin-top: 0; }
    .quiz-option {
      background: #e1f5fe;
      padding: 12px 20px;
      margin: 10px 0;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .quiz-option:hover { transform: scale(1.02); background: #b3e5fc; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📝 Esercizi di Lingua Cinese</h1>
    <p>Benvenuto nell'app Esercizi! Metti alla prova i tuoi vocaboli e i toni della lingua cinese.</p>
    <hr style="border: 0; border-top: 1px dashed #ccc; margin: 20px 0;">
    <h3>Domanda 1: Cosa significa "你好" (Nǐ hǎo)?</h3>
    <div class="quiz-option" onclick="alert('Esatto! 🎉 你好 significa Ciao!')">A) Ciao!</div>
    <div class="quiz-option" onclick="alert('Riprova! 😅')">B) Arrivederci</div>
    <div class="quiz-option" onclick="alert('Riprova! 😅')">C) Grazie</div>
  </div>
</body>
</html>
